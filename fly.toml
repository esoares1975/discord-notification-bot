# fly.toml app configuration file generated for discord-notification-bot-u0764w on 2026-06-15T22:01:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'discord-notification-bot-u0764w'
primary_region = 'gru'
kill_signal = 'SIGINT'
kill_timeout = '30s'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
